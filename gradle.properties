org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# 백엔드 API 주소 (app/build.gradle.kts → BuildConfig.BASE_URL). 비밀값이 아니라 저장소에 둔다.
# - 디버그: 에뮬레이터에서 개발 PC의 로컬 백엔드(10.0.2.2 = PC의 localhost)
# - 출시: 백엔드 배포 주소. HTTPS만 허용(Pleos 앱 보안 가이드). 배포 주소가 정해지면 여기에 넣는다.
altercharge.debugBaseUrl=http://10.0.2.2:8080/api/v1/
altercharge.releaseBaseUrl=
