name: Auto Assign

# PR을 열면 작성자를 담당자(assignee)로 지정한다. 리뷰어 후보가 있으면 리뷰도 자동 요청한다.
# 이슈를 열면 작성자를 담당자로 지정한다.

on:
  pull_request:
    types: [opened, ready_for_review]
  issues:
    types: [opened]

jobs:
  assign:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // 리뷰어 후보(GitHub 아이디). 작성자 본인은 자동으로 제외된다.
            // 프론트를 한 명이 맡는 동안은 작성자만 있어 리뷰 요청을 건너뛴다. 리뷰어를 두게 되면 여기에 추가한다.
            const CANDIDATES = ['karnelll']
            const REVIEWER_COUNT = 1

            const isPR = !!context.payload.pull_request
            const author = isPR
              ? context.payload.pull_request.user.login
              : context.payload.issue.user.login

            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              assignees: [author],
            })

            if (!isPR) return

            const reviewers = CANDIDATES
              .filter(r => r.toLowerCase() !== author.toLowerCase())
              .sort(() => Math.random() - 0.5)
              .slice(0, REVIEWER_COUNT)

            if (reviewers.length === 0) {
              core.info('요청할 리뷰어가 없어 건너뜁니다.')
              return
            }

            await github.rest.pulls.requestReviewers({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              reviewers,
            })
